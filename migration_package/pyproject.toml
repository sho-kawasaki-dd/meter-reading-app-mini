[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "meter-reading-mini"
version = "0.1.0"
description = "ローカル完結型 検針管理デスクトップアプリ (PySide6 + 単一HTMLスマホ検針)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "PySide6>=6.8.0",
    "platformdirs>=4.3.0",
    "pydantic>=2.12.5",
]

[dependency-groups]
dev = [
    "playwright>=1.50.0",
    "pyinstaller>=6.12.0",
    "pyright>=1.1.390",
    "pytest>=9.0.2",
    "pytest-cov>=6.0.0",
    "pytest-qt>=4.4.0",
    "ruff>=0.9.0",
    "tzdata>=2025.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/meter_reading_mini"]

[tool.ruff]
line-length = 100
target-version = "py313"
# Phase 1 で解除: 未移植コードと旧プロジェクト由来のテスト。
extend-exclude = [
    "src/meter_reading_mini/core/meter_master_service.py",
    "src/meter_reading_mini/core/meter_reading_sync.py",
    "src/meter_reading_mini/core/reading_write_orchestration.py",
    "src/meter_reading_mini/core/work_package_download.py",
    "src/meter_reading_mini/db/reference_sqlalchemy/**",
    "tests/test_measurement_definition_schedule_service.py",
    "tests/test_meter_master_service.py",
    "tests/test_meter_reading_sync_service.py",
    "tests/test_meter_reading_sync_service_batch_txn.py",
    "tests/test_reading_write_orchestration.py",
    "tests/test_work_package_download_service.py",
]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["meter_reading_mini"]

[tool.pyright]
pythonVersion = "3.13"
include = ["src", "tests"]
typeCheckingMode = "standard"
strict = [
    "src/meter_reading_mini/core",
    "src/meter_reading_mini/db",
]
# Phase 1 で解除: 未移植コードと旧プロジェクト由来のテスト。
ignore = [
    "src/meter_reading_mini/core/meter_master_service.py",
    "src/meter_reading_mini/core/meter_reading_sync.py",
    "src/meter_reading_mini/core/reading_write_orchestration.py",
    "src/meter_reading_mini/core/work_package_download.py",
    "src/meter_reading_mini/db/reference_sqlalchemy/**",
    "tests/test_measurement_definition_schedule_service.py",
    "tests/test_meter_master_service.py",
    "tests/test_meter_reading_sync_service.py",
    "tests/test_meter_reading_sync_service_batch_txn.py",
    "tests/test_reading_write_orchestration.py",
    "tests/test_work_package_download_service.py",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
qt_api = "pyside6"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    # Phase 1 で解除: 旧プロジェクト由来の import と sqlalchemy 依存。
    "--ignore=tests/test_measurement_definition_schedule_service.py",
    "--ignore=tests/test_meter_master_service.py",
    "--ignore=tests/test_meter_reading_sync_service.py",
    "--ignore=tests/test_meter_reading_sync_service_batch_txn.py",
    "--ignore=tests/test_reading_write_orchestration.py",
    "--ignore=tests/test_work_package_download_service.py",
]
markers = ["perf: 時間のかかる性能計測テスト"]

[tool.coverage.run]
source = ["meter_reading_mini"]
branch = false

[tool.coverage.report]
# Phase 1 で解除: 未移植コードと旧プロジェクト由来のテスト。
include = [
    "*/meter_reading_mini/config.py",
    "*/meter_reading_mini/app.py",
    "*/meter_reading_mini/core/errors.py",
    "*/meter_reading_mini/core/logging_config.py",
    "*/meter_reading_mini/core/contract_models.py",
    "*/meter_reading_mini/core/meter_reading_sync_repositories.py",
    "*/meter_reading_mini/core/reading_signature.py",
    "*/meter_reading_mini/core/timeutil.py",
    "*/meter_reading_mini/core/timezone_settings.py",
    "*/meter_reading_mini/core/usage_delta_calculation.py",
    "*/meter_reading_mini/db/backup.py",
    "*/meter_reading_mini/db/bootstrap_seeds.py",
    "*/meter_reading_mini/db/connection.py",
    "*/meter_reading_mini/db/migrations.py",
    "*/meter_reading_mini/db/repositories.py",
    "*/meter_reading_mini/ui/*.py",
]
omit = [
    "*/meter_reading_mini/core/mobile_reading.py",
    "*/tests/*",
]
